excluded:
  - .build
  - build

opt_in_rules:
  - function_body_length

# Pur style, sans rapport avec le "clean code" visé (taille des fonctions,
# complexité). Désactivées pour ne pas noyer les vrais signaux.
disabled_rules:
  - trailing_comma
  - vertical_parameter_alignment

# Garde-fou "clean code" : une fonction = une responsabilité.
# Les lignes de ces fichiers (seuils) ont été mesurées après la migration
# SPM ; resserrer au fil du refactoring MVVM de la Phase 2, pas avant.
function_body_length:
  warning: 40
  error: 80

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 350
  error: 500

cyclomatic_complexity:
  warning: 12
  error: 20

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true
